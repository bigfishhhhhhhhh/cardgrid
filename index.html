<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#101114" />
  <title>CardGrid</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div>
    <div class="title">CardGrid</div>
    <div class="sub">小卡／收藏排版工具</div>
  </div>
  <div class="top-actions">
    <button id="addCardBtn">＋加一格</button>
    <button id="photoBtn">放照片</button>
  </div>
</header>

<main>
  <section class="preview-section">
    <div class="section-head">
      <strong>畫布預覽</strong>
      <span>點框框選取・雙擊售完</span>
    </div>
    <div class="viewport">
      <div id="board" class="board"></div>
    </div>
  </section>

  <section class="panel">
    <h2>版面</h2>

    <label>每排格數</label>
    <input id="layoutInput" type="text" value="4,4" autocomplete="off" />
    <p class="hint">例：4,4＝兩排各 4 格；4,1＝第一排 4 格、第二排 1 格；5,5,5＝三排各 5 格。</p>

    <label>整排框框對齊</label>
    <select id="rowAlignSelect">
      <option value="top">上緣對齊</option>
      <option value="center">垂直置中</option>
      <option value="bottom">下緣對齊</option>
    </select>

    <label>全域預設尺寸</label>
    <select id="presetSelect">
      <option value="60,92">60 × 92 mm 標準小卡</option>
      <option value="67,92">67 × 92 mm 特殊卡</option>
      <option value="81,107">81 × 107 mm 4吋寬幅</option>
      <option value="96,133">96 × 133 mm 小明信片</option>
      <option value="134,190">134 × 190 mm 大明信片</option>
      <option value="custom">自訂尺寸</option>
    </select>

    <div class="grid2">
      <div><label>全域寬 mm</label><input id="widthInput" type="number" value="60" /></div>
      <div><label>全域高 mm</label><input id="heightInput" type="number" value="92" /></div>
    </div>

    <div class="grid2">
      <div><label>框框間距 px</label><input id="gapInput" type="number" value="10" min="0" /></div>
      <div><label>畫布內距 px</label><input id="padInput" type="number" value="18" min="0" /></div>
    </div>

    <label class="switchline">
      <input id="groupPriceInput" type="checkbox" checked />
      <span>連續相同價格 ≥ 2 張，自動合併成 ——價格/1——</span>
    </label>
  </section>

  <section class="panel">
    <h2>背景與框線</h2>

    <div class="grid2">
      <div>
        <label>背景顏色</label>
        <input id="backgroundColorInput" type="color" value="#ffffff" />
      </div>
      <div>
        <label>背景圖片</label>
        <button id="backgroundImageBtn">選背景圖</button>
      </div>
    </div>
    <button id="clearBackgroundImageBtn" class="full secondary">移除背景圖</button>

    <label class="switchline">
      <input id="borderEnabledInput" type="checkbox" checked />
      <span>顯示框框邊框</span>
    </label>

    <div class="grid3">
      <div><label>邊框顏色</label><input id="borderColorInput" type="color" value="#9ca3af" /></div>
      <div><label>粗細 px</label><input id="borderWidthInput" type="number" value="2" min="0" max="20" /></div>
      <div><label>透明度</label><input id="borderOpacityInput" type="range" min="0" max="1" step="0.05" value="1" /></div>
    </div>

    <div class="grid2">
      <div>
        <label>框框角</label>
        <select id="frameCornerSelect">
          <option value="0">尖角</option>
          <option value="8" selected>小圓角</option>
          <option value="18">大圓角</option>
          <option value="999">膠囊圓角</option>
        </select>
      </div>
      <div>
        <label>照片角</label>
        <select id="photoCornerSelect">
          <option value="0">尖角</option>
          <option value="8" selected>小圓角</option>
          <option value="18">大圓角</option>
          <option value="999">膠囊圓角</option>
        </select>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>目前選取格</h2>
    <div id="noSelection" class="hint">先點上方其中一個框框。</div>

    <div id="editor" hidden>
      <div class="grid2">
        <button id="choosePhotoBtn">上傳／拍照</button>
        <button id="removePhotoBtn">移除照片</button>
      </div>

      <div class="subpanel">
        <div class="subpanel-title">此格尺寸</div>
        <label class="switchline">
          <input id="overrideSizeInput" type="checkbox" />
          <span>此格使用獨立尺寸</span>
        </label>

        <div id="cardSizeControls" class="disabled-block">
          <label>此格預設尺寸</label>
          <select id="cardPresetSelect">
            <option value="60,92">60 × 92 mm 標準小卡</option>
            <option value="67,92">67 × 92 mm 特殊卡</option>
            <option value="81,107">81 × 107 mm 4吋寬幅</option>
            <option value="96,133">96 × 133 mm 小明信片</option>
            <option value="134,190">134 × 190 mm 大明信片</option>
            <option value="custom">自訂尺寸</option>
          </select>
          <div class="grid2">
            <div><label>此格寬 mm</label><input id="cardWidthInput" type="number" value="60" /></div>
            <div><label>此格高 mm</label><input id="cardHeightInput" type="number" value="92" /></div>
          </div>
        </div>
      </div>

      <div class="subpanel">
        <div class="subpanel-title">文字內容與位置</div>
        <p class="hint">「框外上／下」會放在白色背景處；「跨左上」會跨在框框與背景交界。</p>

        <div class="meta-block">
          <label class="switchline"><input id="showNumber" type="checkbox" checked /><span>號碼</span></label>
          <input id="numberInput" />
          <div class="grid2">
            <select id="numberPos"></select>
            <select id="numberStyleSelect">
              <option value="plain">1</option>
              <option value="hash">#1</option>
              <option value="bracket">[1]</option>
              <option value="circle">①</option>
              <option value="zero">01</option>
            </select>
          </div>
          <div class="style-grid">
            <select id="numberFont"></select>
            <input id="numberSize" type="number" min="8" max="80" value="16" />
            <input id="numberColor" type="color" value="#ffffff" />
            <input id="numberOpacity" type="range" min="0" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="meta-block">
          <label class="switchline"><input id="showName" type="checkbox" /><span>名稱</span></label>
          <input id="nameInput" />
          <select id="namePos"></select>
          <div class="style-grid">
            <select id="nameFont"></select>
            <input id="nameSize" type="number" min="8" max="80" value="16" />
            <input id="nameColor" type="color" value="#ffffff" />
            <input id="nameOpacity" type="range" min="0" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="meta-block">
          <label class="switchline"><input id="showPrice" type="checkbox" checked /><span>價格</span></label>
          <input id="priceInput" />
          <select id="pricePos"></select>
          <div class="style-grid">
            <select id="priceFont"></select>
            <input id="priceSize" type="number" min="8" max="80" value="16" />
            <input id="priceColor" type="color" value="#ffffff" />
            <input id="priceOpacity" type="range" min="0" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="meta-block">
          <label class="switchline"><input id="showCustom" type="checkbox" /><span>自訂文字</span></label>
          <input id="customInput" />
          <select id="customPos"></select>
          <div class="style-grid">
            <select id="customFont"></select>
            <input id="customSize" type="number" min="8" max="80" value="16" />
            <input id="customColor" type="color" value="#ffffff" />
            <input id="customOpacity" type="range" min="0" max="1" step="0.05" value="1" />
          </div>
        </div>
      </div>

      <div class="subpanel">
        <div class="subpanel-title">照片調整</div>

        <label>裁切縮放</label>
        <input id="zoomInput" type="range" min="1" max="3" step="0.01" value="1" />

        <label>左右裁切位置</label>
        <input id="xInput" type="range" min="0" max="100" value="50" />

        <label>上下裁切位置</label>
        <input id="yInput" type="range" min="0" max="100" value="50" />

        <label>旋轉校正 °</label>
        <input id="rotateInput" type="range" min="-180" max="180" step="0.5" value="0" />

        <label>水平校正</label>
        <input id="skewYInput" type="range" min="-20" max="20" step="0.1" value="0" />

        <label>傾斜校正</label>
        <input id="skewXInput" type="range" min="-20" max="20" step="0.1" value="0" />

        <label>亮度</label>
        <input id="brightnessInput" type="range" min="0.4" max="1.8" step="0.01" value="1" />

        <label>色溫</label>
        <input id="warmthInput" type="range" min="-1" max="1" step="0.01" value="0" />

        <label class="switchline">
          <input id="soldInput" type="checkbox" />
          <span>售完／灰白</span>
        </label>
      </div>
    </div>
  </section>
</main>

<input id="fileInput" type="file" accept="image/*" hidden />
<input id="backgroundFileInput" type="file" accept="image/*" hidden />
<script type="module" src="/app.js"></script>
</body>
</html>
